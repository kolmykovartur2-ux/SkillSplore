# ---------------------------------------------------------------------------
# SkillSplore marketing-agent — fully independent local stack.
#
#   cd apps/marketing-agent
#   cp .env.example .env
#   docker compose up --build
#   docker compose exec app npm run demo:seed
#
# Then open http://localhost:4100
#
# This file is entirely separate from the root docker-compose.yml. Running
# the marketplace never starts, builds, or depends on any of this; running
# this never touches the marketplace's containers, database, or ports.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillsplore
      POSTGRES_PASSWORD: skillsplore
      POSTGRES_DB: skillsplore_marketing
    ports:
      - "5433:5432"
    volumes:
      - marketing-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsplore -d skillsplore_marketing"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: demo
      API_PORT: "4100"
      DASHBOARD_ORIGIN: http://localhost:4100
      DATABASE_URL: postgresql://skillsplore:skillsplore@db:5432/skillsplore_marketing?schema=public
      SESSION_SECRET: demo-compose-session-secret-change-for-any-real-use
      TOKEN_ENCRYPTION_KEY: demo-compose-token-encryption-key-change-too
      MOCK_LINKEDIN_API: "true"
      CONTENT_AI_PROVIDER: template
      DEFAULT_TIMEZONE: Pacific/Auckland
      MARKETPLACE_LAUNCH_COUNTRY: NZ
      MARKETPLACE_LAUNCH_CITY: Auckland
      MARKETPLACE_LAUNCH_CATEGORY: Tutoring
      MARKETPLACE_LAUNCH_STAGE: Pre-launch
    ports:
      - "4100:4100"
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql://skillsplore:skillsplore@db:5432/skillsplore_marketing?schema=public
      SESSION_SECRET: demo-compose-session-secret-change-for-any-real-use
      TOKEN_ENCRYPTION_KEY: demo-compose-token-encryption-key-change-too
      MOCK_LINKEDIN_API: "true"
      AUTO_PUBLISH_APPROVED_POSTS: "false"
    command: sh -c "node dist/worker.js"

volumes:
  marketing-pg-data:
