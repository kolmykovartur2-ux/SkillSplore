# Render Blueprint for the SkillSplore marketing agent — a separate service
# from the main SkillSplore app's own render.yaml (repo root). Deploying this
# never touches the marketplace's Render service or database.
#
# How to deploy:
#   1. Push this repo to GitHub (Render deploys from a GitHub repo it watches
#      — GitHub itself doesn't run anything, Render does).
#   2. Render dashboard -> New -> Blueprint -> pick this repo -> point it at
#      this file (apps/marketing-agent/render.yaml), not the root one.
#   3. This does NOT provision its own database (Render's free tier only
#      allows one free database per account, and the main app already uses
#      it). Instead, add a SECOND, separate database inside your EXISTING
#      free Postgres instance:
#        a. Open your existing database in the Render dashboard (the one the
#           main SkillSplore app uses) -> "Connect" tab -> open its PSQL
#           shell (or copy the "External Connection String" and connect with
#           any Postgres client).
#        b. Run:  CREATE DATABASE skillsplore_marketing;
#        c. Take the same connection string you used to connect, and change
#           only the database name at the very end from your main app's
#           database name to skillsplore_marketing.
#        d. After this Blueprint syncs (it will show a DATABASE_URL field
#           under the "skillsplore-marketing-shared" env var group waiting to
#           be filled in) — paste that edited connection string there.
#      This keeps the marketing agent's data completely separate from the
#      marketplace's (different database, same free server), at no cost.
#   4. First deploy runs in demo mode (APP_ENV=demo, MOCK_LINKEDIN_API=true)
#      so it boots successfully with no LinkedIn config needed yet — you'll
#      get a real HTTPS URL like https://skillsplore-marketing.onrender.com.
#   5. To go live with real LinkedIn publishing: in the Render dashboard,
#      open the "skillsplore-marketing-shared" env var group and fill in
#      LINKEDIN_CLIENT_ID, LINKEDIN_CLIENT_SECRET, LINKEDIN_ORGANIZATION_URN,
#      and LINKEDIN_REDIRECT_URI (= your Render URL + /api/linkedin/oauth/callback
#      — e.g. https://skillsplore-marketing.onrender.com/api/linkedin/oauth/callback),
#      then change LINKEDIN_PUBLISHING_ENABLED to "true" and MOCK_LINKEDIN_API
#      to "false", and change APP_ENV to "production" on the service below.
#      Saving triggers a redeploy.
#   6. Register that exact same redirect URL in the LinkedIn Developer
#      Portal's Auth tab before trying to connect (LinkedIn rejects a
#      mismatch — see docs/marketing-agent/LINKEDIN_TROUBLESHOOTING.md).

# A named group rather than inline envVars so a future worker service (see
# note below) can share the exact same DATABASE_URL and TOKEN_ENCRYPTION_KEY
# — critical for the worker to be able to decrypt LinkedIn tokens the web
# process encrypted. Two separate `generateValue: true` entries would
# silently give each process a different random key.
envVarGroups:
  - name: skillsplore-marketing-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_ORGANIZATION_URN
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: LINKEDIN_API_VERSION
        value: 202405
      - key: LINKEDIN_PUBLISHING_ENABLED
        value: false
      - key: MOCK_LINKEDIN_API
        value: true
      - key: AUTO_PUBLISH_APPROVED_POSTS
        value: false

services:
  - type: web
    name: skillsplore-marketing
    runtime: docker
    plan: free
    rootDir: apps/marketing-agent
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - fromGroup: skillsplore-marketing-shared
      - key: APP_ENV
        value: demo
      - key: API_PORT
        value: 4100
      - key: APP_URL
        fromService:
          type: web
          name: skillsplore-marketing
          envVarKey: RENDER_EXTERNAL_URL
      - key: DASHBOARD_ORIGIN
        fromService:
          type: web
          name: skillsplore-marketing
          envVarKey: RENDER_EXTERNAL_URL
      - key: FORCE_SECURE_COOKIES
        value: 1
      # First-boot founder account. Set your own before the first deploy,
      # or leave blank for a printed demo-only credential (check logs).
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # --- Content generation: template needs no AI provider or API key ---
      - key: CONTENT_AI_PROVIDER
        value: template
      - key: DEFAULT_TIMEZONE
        value: Pacific/Auckland
      # Render's free tier doesn't persist disk across redeploys -- local
      # media uploads WILL be lost. Fine for testing; switch to
      # OBJECT_STORAGE_PROVIDER=s3 with real credentials (sync: false, added
      # via the dashboard) before relying on the media library for real.
      - key: OBJECT_STORAGE_PROVIDER
        value: local
      - key: OBJECT_STORAGE_LOCAL_DIR
        value: /app/storage-data
      - key: MARKETPLACE_LAUNCH_COUNTRY
        value: NZ
      - key: MARKETPLACE_LAUNCH_CITY
        value: Auckland
      - key: MARKETPLACE_LAUNCH_CATEGORY
        value: Tutoring
      - key: MARKETPLACE_LAUNCH_STAGE
        value: Pre-launch
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 300
      - key: AUTH_RATE_LIMIT_MAX
        value: 20

# No background-worker service here: Render's free plan doesn't support the
# "worker" service type at all ("service type not available for this plan").
# This only disables fully automatic scheduled publishing
# (AUTO_PUBLISH_APPROVED_POSTS) -- "Publish now" in the dashboard still works
# without it. To add automatic scheduling later, upgrade this Render account
# to a paid plan and add a worker service here (rootDir: apps/marketing-agent,
# dockerCommand: node dist/worker.js, envVars: [{fromGroup: skillsplore-marketing-shared}]).
