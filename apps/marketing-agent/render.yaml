# Render Blueprint for the SkillSplore marketing agent — a separate service
# from the main SkillSplore app's own render.yaml (repo root). Deploying this
# never touches the marketplace's Render service or database.
#
# How to deploy:
#   1. Push this repo to GitHub (Render deploys from a GitHub repo it watches
#      — GitHub itself doesn't run anything, Render does).
#   2. Render dashboard -> New -> Blueprint -> pick this repo -> point it at
#      this file (apps/marketing-agent/render.yaml), not the root one.
#   3. First deploy runs in demo mode (APP_ENV=demo, MOCK_LINKEDIN_API=true)
#      so it boots successfully with zero extra config — you'll get a real
#      HTTPS URL like https://skillsplore-marketing.onrender.com.
#   4. To go live with real LinkedIn publishing: in the Render dashboard's
#      Environment tab for this service, fill in LINKEDIN_CLIENT_ID,
#      LINKEDIN_CLIENT_SECRET, LINKEDIN_ORGANIZATION_URN, and
#      LINKEDIN_REDIRECT_URI (= your Render URL + /api/linkedin/oauth/callback
#      — e.g. https://skillsplore-marketing.onrender.com/api/linkedin/oauth/callback),
#      then change APP_ENV to "production" and MOCK_LINKEDIN_API to "false"
#      and LINKEDIN_PUBLISHING_ENABLED to "true". Save -> triggers a redeploy.
#   5. Register that exact same redirect URL in the LinkedIn Developer
#      Portal's Auth tab before trying to connect (LinkedIn rejects a
#      mismatch — see docs/marketing-agent/LINKEDIN_TROUBLESHOOTING.md).

databases:
  - name: skillsplore-marketing-db
    plan: free
    databaseName: skillsplore_marketing
    user: skillsplore

services:
  - type: web
    name: skillsplore-marketing
    runtime: docker
    plan: free
    rootDir: apps/marketing-agent
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: demo
      - key: API_PORT
        value: 4100
      - key: DATABASE_URL
        fromDatabase:
          name: skillsplore-marketing-db
          property: connectionString
      - key: APP_URL
        fromService:
          type: web
          name: skillsplore-marketing
          envVarKey: RENDER_EXTERNAL_URL
      - key: DASHBOARD_ORIGIN
        fromService:
          type: web
          name: skillsplore-marketing
          envVarKey: RENDER_EXTERNAL_URL
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: FORCE_SECURE_COOKIES
        value: 1
      # First-boot founder account. Set your own before the first deploy,
      # or leave blank for a printed demo-only credential (check logs).
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # --- LinkedIn: fill these in via the Render dashboard when ready to
      # go live (never commit real values here) ---
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_ORGANIZATION_URN
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: LINKEDIN_API_VERSION
        value: 202405
      - key: LINKEDIN_PUBLISHING_ENABLED
        value: false
      - key: MOCK_LINKEDIN_API
        value: true
      # --- Content generation: template needs no AI provider or API key ---
      - key: CONTENT_AI_PROVIDER
        value: template
      - key: DEFAULT_TIMEZONE
        value: Pacific/Auckland
      - key: AUTO_PUBLISH_APPROVED_POSTS
        value: false
      # Render's free tier doesn't persist disk across redeploys -- local
      # media uploads WILL be lost. Fine for testing; switch to
      # OBJECT_STORAGE_PROVIDER=s3 with real credentials (sync: false, added
      # via the dashboard) before relying on the media library for real.
      - key: OBJECT_STORAGE_PROVIDER
        value: local
      - key: OBJECT_STORAGE_LOCAL_DIR
        value: /app/storage-data
      - key: MARKETPLACE_LAUNCH_COUNTRY
        value: NZ
      - key: MARKETPLACE_LAUNCH_CITY
        value: Auckland
      - key: MARKETPLACE_LAUNCH_CATEGORY
        value: Tutoring
      - key: MARKETPLACE_LAUNCH_STAGE
        value: Pre-launch
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 300
      - key: AUTH_RATE_LIMIT_MAX
        value: 20

  # Scheduler worker -- same image, different process. Only matters once
  # AUTO_PUBLISH_APPROVED_POSTS=true; "Publish now" in the dashboard works
  # without it. Free tier: comment this out if you don't need automatic
  # publishing yet, to stay within Render's free-tier service count.
  - type: worker
    name: skillsplore-marketing-worker
    runtime: docker
    plan: free
    rootDir: apps/marketing-agent
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/worker.js
    envVars:
      - key: APP_ENV
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: skillsplore-marketing-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_ORGANIZATION_URN
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: LINKEDIN_PUBLISHING_ENABLED
        value: false
      - key: MOCK_LINKEDIN_API
        value: true
      - key: AUTO_PUBLISH_APPROVED_POSTS
        value: false
