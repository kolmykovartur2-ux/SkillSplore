<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>SkillSplore icon</title>
  <!-- Two circles meeting: the match at the core of the product -- a
       student's request meets a tutor's proposal. Deliberately not a
       graduation cap / lightbulb / book / handshake / puzzle piece --
       the genre's stock symbols. Reads at any size down to a 16px favicon
       because it's built from exactly two shapes and their overlap. -->
  <defs>
    <linearGradient id="skillsplore-rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#82bcff" />
      <stop offset="25%" stop-color="#2483ff" />
      <stop offset="50%" stop-color="#ff66f4" />
      <stop offset="75%" stop-color="#ff3029" />
      <stop offset="100%" stop-color="#fe7b02" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="171" ry="171" fill="url(#skillsplore-rainbow)" />
  <circle cx="196" cy="256" r="130" fill="#faf9f6" />
  <circle cx="316" cy="256" r="130" fill="#faf9f6" />
</svg>
